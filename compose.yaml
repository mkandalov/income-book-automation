name: income-book

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: income-book-automation:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${INCOME_BOOK_PORT:-8000}:8000"
    environment:
      INCOME_BOOK_CLIENTS_DIR: /data/clients
    volumes:
      - type: bind
        source: ${INCOME_BOOK_CLIENTS_HOST_DIR:-./private_data/clients}
        target: /data/clients
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      INCOME_BOOK_HOST: ${INCOME_BOOK_HOST:-localhost}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q --spider "https://$${INCOME_BOOK_HOST}/health"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  caddy_data:
  caddy_config:
