name: income-book

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: income-book-automation:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    ports:
      - "${INCOME_BOOK_BIND_ADDRESS:-127.0.0.1}:${INCOME_BOOK_PORT:-8000}:8000"
    environment:
      INCOME_BOOK_CLIENTS_DIR: /data/clients
    volumes:
      - type: bind
        source: ${INCOME_BOOK_CLIENTS_HOST_DIR:-./private_data/clients}
        target: /data/clients
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
