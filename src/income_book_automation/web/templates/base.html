<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page_title }}</title>

    <style>
        :root {
            color-scheme: light;
            --navy-950: #102a2f;
            --navy-800: #1b4248;
            --teal-700: #176d68;
            --teal-600: #1f817a;
            --teal-100: #dff2ef;
            --teal-50: #eff9f7;
            --sand-50: #fbfaf6;
            --sand-100: #f4f0e7;
            --ink-700: #40565a;
            --ink-500: #6d7f82;
            --line: #d9e1df;
            --white: #ffffff;
            --danger: #ae3e36;
            --danger-soft: #fff0ed;
            --shadow: 0 24px 70px rgba(16, 42, 47, 0.1);
            --radius-large: 24px;
            --radius-medium: 16px;
            --radius-small: 10px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
            background: var(--sand-50);
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--navy-950);
            background:
                radial-gradient(circle at 8% 5%, rgba(31, 129, 122, 0.11), transparent 28rem),
                radial-gradient(circle at 92% 28%, rgba(215, 186, 112, 0.12), transparent 24rem),
                var(--sand-50);
            font-family:
                Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            line-height: 1.5;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button,
        select,
        input[type="file"] {
            cursor: pointer;
        }

        [hidden] {
            display: none !important;
        }

        a {
            color: var(--teal-700);
        }

        .topbar {
            border-bottom: 1px solid rgba(27, 66, 72, 0.09);
            background: rgba(251, 250, 246, 0.8);
            backdrop-filter: blur(16px);
        }

        .topbar__inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: min(1120px, calc(100% - 40px));
            min-height: 72px;
            margin: 0 auto;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--navy-950);
            text-decoration: none;
        }

        .brand__mark {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border-radius: 11px;
            color: var(--white);
            background: var(--navy-950);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        .brand__name {
            display: block;
            font-size: 15px;
            font-weight: 750;
        }

        .brand__description {
            display: block;
            color: var(--ink-500);
            font-size: 12px;
        }

        .page-shell {
            width: min(920px, calc(100% - 40px));
            margin: 0 auto;
            padding: 64px 0 80px;
        }

        .hero {
            margin-bottom: 32px;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--teal-700);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        .hero h1,
        .error-card h1 {
            margin: 0;
            max-width: 760px;
            font-size: clamp(34px, 5vw, 54px);
            line-height: 1.06;
            letter-spacing: -0.045em;
        }

        .hero__lead {
            max-width: 650px;
            margin: 18px 0 0;
            color: var(--ink-700);
            font-size: 17px;
        }

        .hero__meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
        }

        .meta-pill {
            padding: 7px 11px;
            border: 1px solid rgba(23, 109, 104, 0.16);
            border-radius: 999px;
            color: var(--teal-700);
            background: rgba(239, 249, 247, 0.75);
            font-size: 12px;
            font-weight: 700;
        }

        .workflow-form {
            display: grid;
            gap: 18px;
        }

        .form-section {
            padding: 26px;
            border: 1px solid rgba(27, 66, 72, 0.11);
            border-radius: var(--radius-large);
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 8px 30px rgba(16, 42, 47, 0.045);
        }

        .source-mode-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .source-mode-card {
            position: relative;
            display: flex;
            min-width: 0;
            min-height: 112px;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: var(--radius-medium);
            background: var(--sand-50);
            cursor: pointer;
            transition: border-color 150ms ease, box-shadow 150ms ease,
                background 150ms ease;
        }

        .source-mode-card:has(input:checked) {
            border-color: var(--teal-600);
            background: var(--teal-50);
            box-shadow: 0 0 0 3px rgba(31, 129, 122, 0.08);
        }

        .source-mode-card input {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: var(--teal-700);
        }

        .source-mode-card input:focus,
        .source-mode-card input:focus-visible {
            box-shadow: none;
            outline: none;
        }

        .source-mode-card:has(input:focus-visible) {
            outline: 3px solid rgba(31, 129, 122, 0.22);
            outline-offset: 2px;
        }

        .source-mode-card__copy {
            display: grid;
            align-content: start;
            gap: 6px;
            padding-right: 26px;
        }

        .source-mode-card__copy strong {
            color: var(--navy-800);
            font-size: 14px;
        }

        .source-mode-card__copy span {
            color: var(--ink-500);
            font-size: 12px;
        }

        .section-heading {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 22px;
        }

        .section-number {
            display: grid;
            flex: 0 0 34px;
            height: 34px;
            place-items: center;
            border-radius: 10px;
            color: var(--teal-700);
            background: var(--teal-100);
            font-size: 13px;
            font-weight: 850;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 19px;
            letter-spacing: -0.02em;
        }

        .section-heading p {
            margin: 4px 0 0;
            color: var(--ink-500);
            font-size: 13px;
        }

        .field-grid {
            display: grid;
            align-items: start;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .field {
            display: grid;
            align-content: start;
            gap: 8px;
        }

        .field--full {
            grid-column: 1 / -1;
        }

        .field__label {
            color: var(--navy-800);
            font-size: 13px;
            font-weight: 750;
        }

        .field__hint {
            margin: -2px 0 0;
            color: var(--ink-500);
            font-size: 12px;
        }

        input[type="text"],
        input[type="search"],
        select {
            width: 100%;
            height: 48px;
            min-height: 48px;
            border: 1px solid var(--line);
            border-radius: var(--radius-small);
            color: var(--navy-950);
            background: var(--white);
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        input[type="text"],
        input[type="search"],
        select {
            padding: 0 13px;
        }

        input[type="search"]::-webkit-search-cancel-button {
            appearance: none;
        }

        .client-combobox {
            position: relative;
        }

        .client-combobox__control {
            position: relative;
            display: flex;
            align-items: center;
            min-height: 54px;
            border: 1px solid var(--line);
            border-radius: 13px;
            background: var(--white);
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        .client-combobox__control:focus-within,
        .client-combobox[data-open="true"] .client-combobox__control {
            border-color: var(--teal-600);
            box-shadow: 0 0 0 4px rgba(31, 129, 122, 0.09);
        }

        .client-combobox.has-error .client-combobox__control {
            border-color: rgba(174, 62, 54, 0.55);
            box-shadow: 0 0 0 3px rgba(174, 62, 54, 0.08);
        }

        .client-combobox__search-icon {
            display: grid;
            flex: 0 0 46px;
            place-items: center;
            color: var(--teal-700);
        }

        .client-combobox__search-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-width: 1.8;
        }

        .client-combobox__input {
            min-width: 0;
            height: 52px !important;
            min-height: 52px !important;
            padding: 0 !important;
            border: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            background: transparent !important;
            font-size: 15px;
            font-weight: 650;
        }

        .client-combobox__input::placeholder {
            color: #879699;
            font-weight: 500;
        }

        .client-combobox__input:focus-visible {
            outline: none;
            outline-offset: 0;
        }

        .client-combobox__input:disabled {
            cursor: not-allowed;
        }

        .client-combobox__toggle {
            display: grid;
            flex: 0 0 46px;
            height: 42px;
            margin: 0 5px;
            place-items: center;
            border: 0;
            border-radius: 9px;
            color: var(--ink-500);
            background: transparent;
        }

        .client-combobox__toggle:hover:not(:disabled) {
            color: var(--teal-700);
            background: var(--teal-50);
        }

        .client-combobox__toggle svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.8;
            transition: transform 150ms ease;
        }

        .client-combobox[data-open="true"] .client-combobox__toggle svg {
            transform: rotate(180deg);
        }

        .client-combobox__panel {
            position: absolute;
            z-index: 20;
            top: calc(100% + 8px);
            right: 0;
            left: 0;
            overflow: hidden;
            border: 1px solid rgba(27, 66, 72, 0.16);
            border-radius: 14px;
            background: var(--white);
            box-shadow: 0 18px 46px rgba(16, 42, 47, 0.16);
        }

        .client-combobox__panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 14px;
            border-bottom: 1px solid var(--line);
            color: var(--ink-500);
            background: var(--sand-50);
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 0.02em;
        }

        .client-combobox__panel-header span:last-child {
            min-width: 26px;
            padding: 3px 7px;
            border-radius: 999px;
            color: var(--teal-700);
            background: var(--teal-100);
            text-align: center;
        }

        .client-combobox__options {
            max-height: 310px;
            padding: 6px;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-color: rgba(23, 109, 104, 0.35) transparent;
            scrollbar-width: thin;
        }

        .client-option {
            display: grid;
            align-items: center;
            grid-template-columns: 42px minmax(0, 1fr) 24px;
            gap: 11px;
            width: 100%;
            min-height: 52px;
            padding: 7px 10px;
            border: 0;
            border-radius: 10px;
            color: var(--navy-950);
            background: transparent;
            text-align: left;
        }

        .client-option:hover,
        .client-option.is-active {
            background: var(--teal-50);
        }

        .client-option[hidden] {
            display: none;
        }

        .client-option[aria-selected="true"] {
            background: var(--teal-100);
        }

        .client-option__badge {
            display: grid;
            width: 42px;
            height: 34px;
            place-items: center;
            border-radius: 9px;
            color: var(--teal-700);
            background: var(--teal-100);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.04em;
        }

        .client-option[aria-selected="true"] .client-option__badge {
            color: var(--white);
            background: var(--teal-700);
        }

        .client-option__name {
            min-width: 0;
            overflow: hidden;
            font-size: 13px;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .client-option__check {
            color: var(--teal-700);
            font-size: 15px;
            font-weight: 900;
            opacity: 0;
        }

        .client-option[aria-selected="true"] .client-option__check {
            opacity: 1;
        }

        .client-combobox__empty {
            margin: 0;
            padding: 28px 18px;
            color: var(--ink-500);
            font-size: 13px;
            text-align: center;
        }

        .client-validation-message,
        .client-catalog-error {
            color: var(--danger);
            font-size: 12px;
            font-weight: 750;
        }

        .client-catalog-error {
            padding: 10px 12px;
            border-radius: 9px;
            background: var(--danger-soft);
        }

        .file-control {
            position: relative;
            display: grid;
            align-items: center;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 10px;
            width: 100%;
            min-height: 48px;
            padding: 6px;
            border: 1px solid var(--line);
            border-radius: var(--radius-small);
            background: var(--white);
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        .file-control:focus-within {
            border-color: var(--teal-600);
            box-shadow: 0 0 0 4px rgba(31, 129, 122, 0.09);
        }

        .file-control.has-error {
            border-color: rgba(174, 62, 54, 0.55);
            box-shadow: 0 0 0 3px rgba(174, 62, 54, 0.08);
        }

        .upload-file-input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            border: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .choose-file-button {
            min-height: 34px;
            padding: 0 12px;
            border: 0;
            border-radius: 7px;
            color: var(--navy-950);
            background: var(--sand-100);
            font-size: 13px;
            font-weight: 800;
        }

        .choose-file-button:hover {
            background: #ede7da;
        }

        .selected-file-name {
            min-width: 0;
            overflow: hidden;
            color: var(--ink-500);
            font-size: 13px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .clear-file-button {
            min-height: 34px;
            padding: 0 10px;
            border: 1px solid rgba(174, 62, 54, 0.2);
            border-radius: 7px;
            color: var(--danger);
            background: var(--danger-soft);
            font-size: 11px;
            font-weight: 800;
        }

        .clear-file-button:hover {
            border-color: rgba(174, 62, 54, 0.38);
        }

        .file-validation-message {
            margin-top: -2px;
            color: var(--danger);
            font-size: 12px;
            font-weight: 750;
        }

        input:focus-visible,
        select:focus-visible,
        button:focus-visible,
        a:focus-visible {
            outline: 3px solid rgba(31, 129, 122, 0.22);
            outline-offset: 2px;
        }

        input:focus,
        select:focus {
            border-color: var(--teal-600);
            box-shadow: 0 0 0 4px rgba(31, 129, 122, 0.09);
        }

        .statements {
            display: grid;
            gap: 12px;
        }

        .statement-card {
            min-width: 0;
            margin: 0;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: var(--radius-medium);
            background: var(--sand-50);
        }

        .statement-card__top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        .statement-card__title {
            margin: 0;
            font-size: 14px;
            font-weight: 800;
        }

        .statement-card__fields {
            display: grid;
            grid-template-columns: 0.7fr 1.3fr;
            gap: 14px;
        }

        .text-button {
            padding: 6px 9px;
            border: 0;
            border-radius: 8px;
            color: var(--danger);
            background: transparent;
            font-size: 12px;
            font-weight: 750;
        }

        .text-button:hover {
            background: var(--danger-soft);
        }

        .section-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 14px;
        }

        .secondary-button {
            padding: 10px 14px;
            border: 1px solid rgba(23, 109, 104, 0.22);
            border-radius: 10px;
            color: var(--teal-700);
            background: var(--teal-50);
            font-size: 13px;
            font-weight: 800;
        }

        .secondary-button:hover:not(:disabled) {
            background: var(--teal-100);
        }

        .secondary-button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .statement-status {
            min-height: 20px;
            margin: 0;
            color: var(--ink-500);
            font-size: 12px;
            text-align: right;
        }

        .helper-columns-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .helper-column-card {
            display: grid;
            align-items: end;
            grid-template-columns: minmax(0, 1fr) 142px;
            gap: 16px;
            padding: 17px;
            border: 1px solid var(--line);
            border-radius: var(--radius-medium);
            background: var(--sand-50);
        }

        .helper-column-card.has-error {
            border-color: rgba(174, 62, 54, 0.5);
            box-shadow: 0 0 0 3px rgba(174, 62, 54, 0.07);
        }

        .helper-column-card__copy,
        .helper-column-card__control {
            display: grid;
            gap: 5px;
            min-width: 0;
        }

        .helper-column-card__title {
            color: var(--navy-800);
            font-size: 13px;
            font-weight: 800;
        }

        .helper-column-card__description,
        .helper-column-card__default {
            color: var(--ink-500);
            font-size: 11px;
        }

        .helper-column-card__default {
            font-weight: 700;
            text-align: right;
        }

        .field-error {
            margin: 12px 0 0;
            padding: 10px 12px;
            border-radius: 9px;
            color: var(--danger);
            background: var(--danger-soft);
            font-size: 12px;
            font-weight: 750;
        }

        .manual-warning {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 19px 21px;
            border: 1px solid rgba(174, 118, 23, 0.24);
            border-radius: var(--radius-medium);
            color: #624812;
            background: #fff8e6;
        }

        .manual-warning__mark {
            display: grid;
            flex: 0 0 30px;
            height: 30px;
            place-items: center;
            border-radius: 9px;
            color: #fffaf0;
            background: #a86f12;
            font-size: 16px;
            font-weight: 900;
        }

        .manual-warning h2 {
            margin: 1px 0 6px;
            font-size: 15px;
            letter-spacing: -0.01em;
        }

        .manual-warning p {
            margin: 0;
            font-size: 13px;
        }

        .manual-warning p + p {
            margin-top: 7px;
        }

        .generation-result {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 22px 24px;
            border: 1px solid rgba(31, 129, 122, 0.24);
            border-radius: var(--radius-medium);
            background: var(--teal-50);
            box-shadow: 0 14px 36px rgba(16, 42, 47, 0.07);
            outline: none;
        }

        .generation-result[data-state="warning"] {
            border-color: rgba(174, 118, 23, 0.3);
            background: #fff8e6;
        }

        .generation-result[data-state="error"] {
            border-color: rgba(174, 62, 54, 0.28);
            background: var(--danger-soft);
        }

        .generation-result__mark {
            display: grid;
            flex: 0 0 34px;
            height: 34px;
            place-items: center;
            border-radius: 10px;
            color: var(--white);
            background: var(--teal-700);
            font-size: 17px;
            font-weight: 900;
        }

        .generation-result[data-state="warning"] .generation-result__mark {
            background: #a86f12;
        }

        .generation-result[data-state="error"] .generation-result__mark {
            background: var(--danger);
        }

        .generation-result__content {
            flex: 1;
            min-width: 0;
        }

        .generation-result h2 {
            margin: 1px 0 6px;
            font-size: 17px;
            letter-spacing: -0.01em;
        }

        .generation-result p {
            margin: 0;
            color: var(--ink-700);
            font-size: 13px;
        }

        .checkbox-warning-list {
            display: grid;
            gap: 10px;
            margin-top: 16px;
        }

        .checkbox-warning-list:empty {
            display: none;
        }

        .checkbox-warning-card {
            padding: 15px 16px;
            border: 1px solid rgba(174, 118, 23, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.78);
        }

        .checkbox-warning-card__heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
        }

        .checkbox-warning-card__heading strong {
            color: var(--navy-950);
            font-size: 14px;
        }

        .checkbox-warning-card__heading span {
            padding: 4px 8px;
            border-radius: 999px;
            color: #725217;
            background: #fff0c5;
            font-size: 11px;
            font-weight: 800;
        }

        .checkbox-warning-card__amounts {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin: 0;
        }

        .checkbox-warning-card__amount {
            padding: 9px 10px;
            border-radius: 9px;
            background: var(--sand-50);
        }

        .checkbox-warning-card__amount dt {
            margin-bottom: 3px;
            color: var(--ink-500);
            font-size: 10px;
            font-weight: 750;
            text-transform: uppercase;
        }

        .checkbox-warning-card__amount dd {
            margin: 0;
            color: var(--navy-950);
            font-size: 13px;
            font-weight: 800;
        }

        .checkbox-warning-card__amount--result {
            background: var(--danger-soft);
        }

        .checkbox-warning-card__amount--result dd {
            color: var(--danger);
        }

        .submit-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 22px 24px;
            border-radius: var(--radius-large);
            color: var(--white);
            background: var(--navy-950);
            box-shadow: var(--shadow);
        }

        .submit-panel p {
            margin: 0;
            color: rgba(255, 255, 255, 0.72);
            font-size: 13px;
        }

        .submit-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 220px;
            min-height: 50px;
            padding: 0 18px;
            border: 0;
            border-radius: 12px;
            color: var(--navy-950);
            background: #f2d589;
            font-weight: 850;
            transition: transform 150ms ease, opacity 150ms ease;
        }

        .submit-button:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .submit-button:disabled {
            cursor: wait;
            opacity: 0.72;
        }

        .button-spinner {
            display: none;
            width: 17px;
            height: 17px;
            border: 2px solid rgba(16, 42, 47, 0.25);
            border-top-color: var(--navy-950);
            border-radius: 50%;
            animation: spin 700ms linear infinite;
        }

        .is-submitting .button-spinner {
            display: inline-block;
        }

        .error-card {
            max-width: 720px;
            margin: 40px auto 0;
            padding: 38px;
            border: 1px solid rgba(174, 62, 54, 0.18);
            border-radius: var(--radius-large);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: var(--shadow);
        }

        .error-card__label {
            display: inline-block;
            margin-bottom: 18px;
            padding: 7px 10px;
            border-radius: 999px;
            color: var(--danger);
            background: var(--danger-soft);
            font-size: 12px;
            font-weight: 850;
        }

        .error-card h1 {
            font-size: clamp(30px, 5vw, 44px);
        }

        .error-card__description {
            margin: 16px 0 8px;
            color: var(--ink-700);
        }

        .error-message {
            margin: 20px 0 28px;
            padding: 16px;
            border-left: 4px solid var(--danger);
            border-radius: 8px;
            color: #75312c;
            background: var(--danger-soft);
            overflow-wrap: anywhere;
        }

        .back-link {
            display: inline-flex;
            padding: 11px 15px;
            border-radius: 10px;
            color: var(--white);
            background: var(--teal-700);
            font-weight: 800;
            text-decoration: none;
        }

        .review-page {
            width: min(1280px, calc(100vw - 40px));
            margin-left: 50%;
            transform: translateX(-50%);
        }

        .review-hero {
            display: grid;
            gap: 22px;
            margin-bottom: 18px;
            padding: 32px;
            border: 1px solid rgba(174, 62, 54, 0.18);
            border-radius: var(--radius-large);
            background: rgba(255, 255, 255, 0.96);
            box-shadow: var(--shadow);
        }

        .review-hero__top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
        }

        .review-hero__label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding: 7px 11px;
            border-radius: 999px;
            color: var(--danger);
            background: var(--danger-soft);
            font-size: 12px;
            font-weight: 850;
        }

        .review-hero__label::before {
            content: "!";
            display: grid;
            width: 18px;
            height: 18px;
            place-items: center;
            border-radius: 50%;
            color: var(--white);
            background: var(--danger);
            font-size: 11px;
        }

        .review-hero h1 {
            margin: 0;
            max-width: 780px;
            font-size: clamp(30px, 4vw, 46px);
            line-height: 1.08;
            letter-spacing: -0.04em;
        }

        .review-hero__description {
            max-width: 780px;
            margin: 14px 0 0;
            color: var(--ink-700);
            font-size: 16px;
        }

        .review-count {
            display: grid;
            flex: 0 0 150px;
            gap: 2px;
            padding: 17px 19px;
            border: 1px solid rgba(174, 62, 54, 0.14);
            border-radius: var(--radius-medium);
            background: var(--danger-soft);
        }

        .review-count strong {
            color: var(--danger);
            font-size: 30px;
            line-height: 1;
        }

        .review-count span {
            color: #75312c;
            font-size: 12px;
            font-weight: 750;
        }

        .review-stop-notice {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 0;
            padding: 15px 17px;
            border-left: 4px solid var(--danger);
            border-radius: 9px;
            color: #75312c;
            background: var(--danger-soft);
            font-size: 13px;
        }

        .review-stop-notice strong {
            display: block;
            margin-bottom: 2px;
        }

        .review-instructions {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin: 0;
            padding: 0;
            list-style: none;
            counter-reset: review-step;
        }

        .review-instructions li {
            position: relative;
            min-height: 74px;
            padding: 14px 14px 14px 48px;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--ink-700);
            background: var(--sand-50);
            font-size: 12px;
            counter-increment: review-step;
        }

        .review-instructions li::before {
            content: counter(review-step);
            position: absolute;
            top: 14px;
            left: 14px;
            display: grid;
            width: 24px;
            height: 24px;
            place-items: center;
            border-radius: 8px;
            color: var(--teal-700);
            background: var(--teal-100);
            font-size: 11px;
            font-weight: 850;
        }

        .review-table-card {
            padding: 24px;
            border: 1px solid rgba(27, 66, 72, 0.11);
            border-radius: var(--radius-large);
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 8px 30px rgba(16, 42, 47, 0.045);
        }

        .review-table-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 17px;
        }

        .review-table-heading h2 {
            margin: 0;
            font-size: 19px;
            letter-spacing: -0.02em;
        }

        .review-table-heading p {
            margin: 4px 0 0;
            color: var(--ink-500);
            font-size: 12px;
        }

        .review-table-wrap {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: var(--radius-medium);
        }

        .review-table {
            width: 100%;
            min-width: 1050px;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 12px;
        }

        .review-table th {
            padding: 12px 14px;
            color: var(--ink-500);
            background: var(--sand-100);
            font-size: 10px;
            font-weight: 850;
            letter-spacing: 0.07em;
            text-align: left;
            text-transform: uppercase;
        }

        .review-table th:nth-child(1) { width: 19%; }
        .review-table th:nth-child(2) { width: 16%; }
        .review-table th:nth-child(3) { width: 23%; }
        .review-table th:nth-child(4) { width: 22%; }
        .review-table th:nth-child(5) { width: 20%; }

        .review-table td {
            padding: 15px 14px;
            border-top: 1px solid var(--line);
            vertical-align: top;
            overflow-wrap: anywhere;
        }

        .review-table tbody tr:nth-child(even) {
            background: rgba(244, 240, 231, 0.35);
        }

        .review-cell {
            display: grid;
            gap: 7px;
        }

        .review-cell__primary {
            color: var(--navy-950);
            font-weight: 800;
        }

        .review-cell__line {
            color: var(--ink-700);
        }

        .review-cell__label {
            color: var(--ink-500);
            font-size: 10px;
            font-weight: 750;
            text-transform: uppercase;
        }

        .review-missing-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .review-missing-list li {
            padding: 5px 7px;
            border-radius: 7px;
            color: #75312c;
            background: var(--danger-soft);
            font-size: 10px;
            font-weight: 800;
        }

        .review-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-top: 18px;
        }

        .review-actions p {
            margin: 0;
            color: var(--ink-500);
            font-size: 12px;
        }

        .footer {
            width: min(920px, calc(100% - 40px));
            margin: 0 auto;
            padding: 0 0 34px;
            color: var(--ink-500);
            font-size: 12px;
            text-align: center;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 700px) {
            .brand__description {
                display: none;
            }

            .page-shell {
                padding-top: 40px;
            }

            .field-grid,
            .source-mode-grid,
            .statement-card__fields,
            .helper-columns-grid {
                grid-template-columns: 1fr;
            }

            .helper-column-card {
                grid-template-columns: minmax(0, 1fr) 130px;
            }

            .form-section {
                padding: 20px;
            }

            .submit-panel {
                align-items: stretch;
                flex-direction: column;
            }

            .submit-button {
                width: 100%;
            }

            .generation-result {
                padding: 19px;
            }

            .checkbox-warning-card__heading {
                align-items: flex-start;
                flex-direction: column;
                gap: 7px;
            }

            .checkbox-warning-card__amounts {
                grid-template-columns: 1fr;
            }

            .review-page {
                width: min(100%, calc(100vw - 24px));
            }

            .review-hero,
            .review-table-card {
                padding: 20px;
            }

            .review-hero__top,
            .review-actions {
                align-items: stretch;
                flex-direction: column;
            }

            .review-count {
                width: 100%;
            }

            .review-instructions {
                grid-template-columns: 1fr;
            }

            .review-actions .back-link {
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <div class="topbar__inner">
            <a class="brand" href="/">
                <span class="brand__mark">КД</span>

                <span>
                    <span class="brand__name">Книга доходів</span>
                    <span class="brand__description">Автоматизація підготовки</span>
                </span>
            </a>

        </div>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        © 2026 Ресторанна Бухгалтерія. Усі права захищені.
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
